
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mật Thư Pro Studio</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-color: #00d2fc;
            --sidebar-width: 80px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            display: flex; margin: 0; height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, sans-serif; color: white;
            overflow: hidden; touch-action: none;
        }

        .bg-blob {
            position: absolute; width: 300px; height: 300px;
            background: linear-gradient(135deg, #ff0080, #7928ca);
            filter: blur(80px); border-radius: 50%; z-index: 0; opacity: 0.3; pointer-events: none;
        }

        .sidebar {
            width: var(--sidebar-width); height: 100%;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; align-items: center; 
            padding-top: 40px; padding-bottom: 20px; /* Thêm padding dưới */
            z-index: 1000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Cập nhật quan trọng: Cho phép cuộn khi menu quá dài */
            overflow-y: auto; 
            scrollbar-width: none; /* Ẩn cho Firefox */
        }

        .sidebar::-webkit-scrollbar {
            display: none; /* Ẩn cho Chrome, Safari */
        }

        /* --- OVERLAY CHẶN TƯƠNG TÁC --- */
        #menuOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            z-index: 900;
        }

       .menu-item {
            writing-mode: vertical-rl; transform: rotate(180deg); 
            padding: 15px 10px; /* Thu nhỏ padding một chút */
            margin: 10px 0;    /* Thu nhỏ margin */
            font-size: 0.85rem; /* Thu nhỏ font một chút để chứa được nhiều hơn */
            letter-spacing: 2px; 
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer; transition: 0.3s; text-transform: uppercase; 
            text-decoration: none; border-right: 3px solid transparent;
            flex-shrink: 0; /* KHÔNG CHO PHÉP CÁC MỤC BỊ CO LẠI */
        }

        .menu-item.active {
            color: #00d2fc;
            border-right: 3px solid #00d2fc;
        }

        /* --- NÚT TOGGLE --- */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 200;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .sidebar {
                position: fixed;
                left: 0;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar.open ~ .menu-toggle { opacity: 0; visibility: hidden; }
            #menuOverlay.show { display: block; }
        }
        /* --- MAIN AREA --- */
        .main-container {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; z-index: 1;
        }

        .display-panel {
            width: 100%; max-width: 480px;
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 20px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .status-title {
            font-size: 1.5rem; font-weight: 900; color: var(--accent-color);
            text-shadow: 0 0 15px rgba(0,210,252,0.6); height: 40px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 5px; text-transform: uppercase;
        }

        /* --- DROPDOWN DẠNG MẬT THƯ --- */
        .type-selector {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            color: white; padding: 10px; border-radius: 12px; outline: none;
            margin-bottom: 15px; font-weight: bold; font-size: 13px; text-align: center;
            appearance: none; cursor: pointer;
        }

        .mode-selector {
            display: flex; background: rgba(0,0,0,0.3); border-radius: 10px;
            padding: 4px; margin-bottom: 10px; gap: 4px;
        }
        .mode-btn {
            flex: 1; border: none; background: none; color: rgba(255,255,255,0.4);
            padding: 8px; border-radius: 8px; font-size: 11px; font-weight: bold;
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        .mode-btn.active { background: var(--accent-color); color: #1a1a2e; }

        /* --- DÒ KHÓA AREA --- */
        .finder-box {
            position: relative;
            display: flex; gap: 15px; align-items: flex-start; justify-content: center;
            background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 12px; margin-bottom: 15px;
            height: 160px;
        }
        .finder-input {
            width: 65px; height: 50px; background: rgba(0,0,0,0.4); border: 1px solid var(--accent-color);
            border-radius: 12px; color: white; text-align: center; font-weight: bold; outline: none; font-size: 1.4rem;
        }

        .scroll-container-overlay {
            position: absolute; bottom: 10px; left: 12px; right: 12px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .letter-scroll {
            display: flex; overflow-x: auto; gap: 5px; scrollbar-width: none;
        }
        .letter-scroll::-webkit-scrollbar { display: none; }
        .letter-item {
            flex: 0 0 32px; height: 32px; background: rgba(255,255,255,0.1);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px;
        }
        .letter-item.selected { background: var(--accent-color); color: #1a1a2e; }

        .box-title { color: rgba(255,255,255,0.4); font-size: 10px; text-transform: uppercase; text-align: left; margin-bottom: 4px; font-weight: bold; }
        .row-group { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; width: 100%; position: relative; }

        .fixed-box {
            flex: 1; width: 0; min-width: 0; height: 45px; 
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px; padding: 0 12px; color: white; font-size: 0.95rem;
            display: flex; align-items: center; justify-content: center;
            white-space: nowrap; overflow-x: auto; scrollbar-width: none;
        }
        input.fixed-box { display: block; text-align: center; outline: none; text-transform: uppercase; }
        .btn-xem { flex-shrink: 0; height: 42px; padding: 0 12px; background: var(--accent-color); color: #1a1a2e; border: none; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; }

        .xuoi-style { color: var(--accent-color); }
        .nguoc-style { color: #ff0080; }

        .btn-grid { display: grid; grid-template-columns: 1fr; gap: 10px; width: 100%; margin-top: 5px; }
        button.action-btn { padding: 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); color: white; font-weight: bold; border: 1px solid rgba(255,255,255,0.1); text-transform: uppercase; font-size: 12px; cursor: pointer; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; backdrop-filter: blur(10px); justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: rgba(20, 20, 35, 0.95); border: 1px solid var(--accent-color); border-radius: 20px; width: 100%; max-width: 450px; padding: 25px; }
        .modal-body { max-height: 50vh; overflow-y: auto; color: white; font-size: 1.1rem; text-align: center; }
        .btn-close { margin-top: 20px; width: 100%; background: var(--accent-color); color: #1a1a2e; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="bg-blob" style="top: -100px; left: -100px;"></div>
    <div id="menuOverlay"></div>

    <button class="menu-toggle" id="menuToggle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>

     <aside class="sidebar" id="sidebar">
        <a href="index.html" class="menu-item">Bảng Xoay</a>
        <a href="morse.html" class="menu-item ">Morse</a>
        <a href="semaphore.html" class="menu-item ">Semaphore</a>
        <a href="thaythe.html" class="menu-item active">Thay thế</a>
        <a href="camranh.html" class="menu-item ">Cam ranh</a>
    </aside>

    <main class="main-container">
        <div class="display-panel" onclick="event.stopPropagation()">
            <div class="status-title">HỆ THỐNG MẬT THƯ</div>

            <select class="type-selector" id="cipherType" style="display: none;">
                <option value="replacement">MẬT THƯ THAY THẾ (CAESAR)</option>
                <option value="camranh">MẬT THƯ CAM RANH (TỌA ĐỘ)</option>
                <option value="keyboard">MẬT THƯ BÀN PHÍM</option>
            </select>

            <div id="replacementControls">
                <div class="mode-selector">
                    <button class="mode-btn active" id="modeAlpha">Chữ Thay Chữ</button>
                    <button class="mode-btn" id="modeNum">Số Thay Chữ</button>
                </div>
                
                <div class="box-title" style="text-align: center;">NHẬP CHÌA KHÓA</div>
                <div class="finder-box">
                    <input type="text" id="findBase" class="finder-input" placeholder="G" maxlength="1">
                    <span style="font-weight: bold; font-size: 1.8rem; color: var(--accent-color); margin-top: 10px;">=</span>
                    <input type="text" id="findCoded" class="finder-input" placeholder="M" maxlength="2">

                    <div class="scroll-container-overlay">
                        <div class="letter-scroll" id="scrollBase"></div>
                        <div class="letter-scroll" id="scrollCoded"></div>
                    </div>
                </div>
            </div>

            <div class="box-title">VĂN BẢN CẦN GIẢI / MÃ</div>
            <div class="row-group">
                <input type="text" id="inputText" class="fixed-box" placeholder="NHẬP NỘI DUNG..." spellcheck="false">
                <button class="btn-xem" id="btnViewRaw">XEM</button>
            </div>

            <div class="box-title" style="color: var(--accent-color);">BẢN DỊCH XUÔI (GIẢI MÃ)</div>
            <div class="row-group">
                <div class="fixed-box xuoi-style" id="outputForward">-</div>
                <button class="btn-xem" id="btnViewForward">XEM</button>
            </div>

            <div class="box-title" style="color: #ff0080;">BẢN DỊCH NGƯỢC (MÃ HÓA)</div>
            <div class="row-group">
                <div class="fixed-box nguoc-style" id="outputBackward">-</div>
                <button class="btn-xem" id="btnViewBackward">XEM</button>
            </div>

            <div class="btn-grid">
                <button id="btnClear" class="action-btn">XÓA TRẮNG</button>
            </div>
        </div>
    </main>

    <div class="modal" id="infoModal">
        <div class="modal-content">
            <div class="modal-body" id="modalBody"></div>
            <button class="btn-close" id="btnClose">ĐÓNG</button>
        </div>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar'), overlay = document.getElementById('menuOverlay'), menuToggle = document.getElementById('menuToggle');
        const input = document.getElementById('inputText'), outputF = document.getElementById('outputForward'), outputB = document.getElementById('outputBackward');
        const findBase = document.getElementById('findBase'), findCoded = document.getElementById('findCoded');
        const scrollBase = document.getElementById('scrollBase'), scrollCoded = document.getElementById('scrollCoded');
        const modeAlpha = document.getElementById('modeAlpha'), modeNum = document.getElementById('modeNum');
        const cipherType = document.getElementById('cipherType');

        let currentKey = 0;
        let currentMode = 'alpha'; 
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        const numbers = Array.from({length: 26}, (_, i) => (i + 1).toString());

        function renderPickers() {
            scrollBase.innerHTML = ''; scrollCoded.innerHTML = '';
            alphabet.forEach(char => {
                const bItem = document.createElement('div'); bItem.className = 'letter-item'; bItem.innerText = char;
                bItem.onclick = () => { findBase.value = char; highlight(scrollBase, bItem); calculateKey(); };
                scrollBase.appendChild(bItem);
            });

            const codedSource = currentMode === 'alpha' ? alphabet : numbers;
            codedSource.forEach(item => {
                const cItem = document.createElement('div'); cItem.className = 'letter-item'; cItem.innerText = item;
                cItem.onclick = () => { findCoded.value = item; highlight(scrollCoded, cItem); calculateKey(); };
                scrollCoded.appendChild(cItem);
            });
        }

        function highlight(parent, item) {
            parent.querySelectorAll('.letter-item').forEach(i => i.classList.remove('selected'));
            item.classList.add('selected');
        }

        function calculateKey() {
            if (cipherType.value !== 'replacement') return;
            const baseIdx = alphabet.indexOf(findBase.value.toUpperCase());
            if (baseIdx === -1) return;

            if (currentMode === 'alpha') {
                const codedIdx = alphabet.indexOf(findCoded.value.toUpperCase());
                if (codedIdx !== -1) currentKey = (codedIdx - baseIdx + 26) % 26;
            } else {
                const numVal = parseInt(findCoded.value);
                if (!isNaN(numVal)) currentKey = (numVal - 1 - baseIdx + 26) % 26;
            }
            updateDisplay();
        }

        function processText(text, key, isReverse = false) {
            if (!text) return "-";
            const type = cipherType.value;
            const upperText = text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
            
            if (type === 'replacement') {
                if (currentMode === 'alpha') {
                    let shift = isReverse ? key : (26 - key);
                    return upperText.split('').map(char => {
                        let idx = alphabet.indexOf(char);
                        return idx !== -1 ? alphabet[(idx + shift) % 26] : char;
                    }).join('');
                } else {
                    if (isReverse) { 
                        return upperText.replace(/[A-Z]/g, (char) => {
                            let idx = alphabet.indexOf(char);
                            return ((idx + key) % 26 + 1);
                        });
                    } else { 
                        return upperText.replace(/\d+/g, (numStr) => {
                            let n = parseInt(numStr);
                            if (n >= 1 && n <= 100) return alphabet[(n - 1 - key + 520) % 26];
                            return numStr;
                        });
                    }
                }
            } else if (type === 'camranh') {
                // Logic Cam Ranh tạm thời (Ví dụ: Tọa độ hóa)
                return "[Chế độ Cam Ranh đang phát triển]";
            }
            return "-";
        }

        function updateDisplay() {
            outputF.innerText = processText(input.value, currentKey, false);
            outputB.innerText = processText(input.value, currentKey, true);
        }

        cipherType.onchange = () => {
            const controls = document.getElementById('replacementControls');
            controls.style.display = cipherType.value === 'replacement' ? 'block' : 'none';
            updateDisplay();
        };

        modeAlpha.onclick = () => { currentMode = 'alpha'; modeAlpha.classList.add('active'); modeNum.classList.remove('active'); renderPickers(); calculateKey(); };
        modeNum.onclick = () => { currentMode = 'num'; modeNum.classList.add('active'); modeAlpha.classList.remove('active'); renderPickers(); calculateKey(); };

        renderPickers();
        menuToggle.onclick = (e) => { sidebar.classList.add('open'); overlay.classList.add('show'); e.stopPropagation(); }
        overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('show'); }
        findBase.oninput = calculateKey;
        findCoded.oninput = calculateKey;
        input.oninput = updateDisplay;

        const modal = document.getElementById('infoModal'), modalBody = document.getElementById('modalBody');
        const openModal = (t) => { modalBody.innerText = t || "Trống"; modal.style.display = "flex"; }
        document.getElementById('btnViewRaw').onclick = () => openModal(input.value);
        document.getElementById('btnViewForward').onclick = () => openModal(outputF.innerText);
        document.getElementById('btnViewBackward').onclick = () => openModal(outputB.innerText);
        document.getElementById('btnClose').onclick = () => modal.style.display = "none";
        document.getElementById('btnClear').onclick = () => { input.value = ""; findBase.value=""; findCoded.value=""; currentKey = 0; updateDisplay(); document.querySelectorAll('.letter-item').forEach(i => i.classList.remove('selected')); };
    </script>
</body>
</html>
